name: Native archive qualification

on:
  push:
    branches: [master, windows/native-build]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build native Unix tools
        run: make -j2
      - name: Test binary and multiple-member round trips
        shell: pwsh
        run: ./packaging/test_roundtrip.ps1 -ArcPath ./arc -WorkDirectory /tmp/arcfixture
      - uses: actions/upload-artifact@v4
        with:
          name: linux-reference
          path: /tmp/arcfixture/trial.arc

  windows-build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 wixl
      - name: Cross-build native Windows tools
        shell: pwsh
        run: ./build_windows.ps1 -Architecture '${{ matrix.architecture }}' -OutputDirectory '${{ runner.temp }}/arc-output'
      - name: Include complete matching source and build scripts
        run: git archive --format=tar.gz -o '${{ runner.temp }}/arc-output/source.tar.gz' HEAD
      - name: Build native MSI with managed system PATH
        shell: pwsh
        run: ./new_windows_msi.ps1 -BinaryDirectory '${{ runner.temp }}/arc-output' -SourceArchive '${{ runner.temp }}/arc-output/source.tar.gz' -OutputDirectory '${{ runner.temp }}/arc-msi' -Architecture '${{ matrix.architecture }}'
      - uses: actions/upload-artifact@v4
        with:
          name: msi-${{ matrix.architecture }}
          path: ${{ runner.temp }}/arc-msi/*.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: ${{ runner.temp }}/arc-output/

  windows-test:
    needs: [linux, windows-build]
    runs-on: windows-2022
    strategy:
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: C:/arctools
      - uses: actions/download-artifact@v4
        with:
          name: linux-reference
          path: C:/arcref
      - name: Test native Windows and Unix archive compatibility
        shell: pwsh
        run: ./packaging/test_roundtrip.ps1 -ArcPath C:/arctools/arc.exe -WorkDirectory C:/arcfixture -ReferenceArchive C:/arcref/trial.arc -CheckWindowsNames
      - uses: actions/upload-artifact@v4
        with:
          name: windows-reference-${{ matrix.architecture }}
          path: C:/arcfixture/trial.arc

  reverse-compatibility:
    needs: windows-test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-reference-${{ matrix.architecture }}
          path: /tmp/arcref
      - run: make -j2
      - name: Read native Windows archive on Unix
        shell: pwsh
        run: ./packaging/test_roundtrip.ps1 -ArcPath ./arc -ReferenceArchive /tmp/arcref/trial.arc

  windows-msi-test:
    needs: windows-build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        architecture: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: msi-${{ matrix.architecture }}
          path: C:/arcpkg
      - name: Install, repair, verify CMD/PowerShell PATH and uninstall
        shell: pwsh
        run: |
          $package = (Get-ChildItem C:/arcpkg/*.msi).FullName
          ./packaging/test_windows_msi.ps1 -Package $package -Architecture '${{ matrix.architecture }}'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows-build, windows-test, reverse-compatibility, windows-msi-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish qualified portable packages, MSI and matching source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 packaging/prepare_release.py artifacts release
          cd release
          sha256sum *.zip *.msi *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "SEA ARC $GITHUB_REF_NAME" --notes-file ../packaging/RELEASE.md *.zip *.msi *.tar.gz SHA256SUMS
